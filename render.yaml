services:
  - type: pserv
    name: kaizen-mysql
    runtime: image
    image:
      url: docker.io/library/mysql:8.0
    region: virginia
    plan: 0.5c-512mb
    autoDeployTrigger: off
    disk:
      name: kaizen-mysql-data
      mountPath: /var/lib/mysql
      sizeGB: 10
    envVars:
      - key: MYSQL_DATABASE
        value: comp_kaizen
      - key: MYSQL_USER
        value: kaizen_app
      - key: MYSQL_PASSWORD
        generateValue: true
      - key: MYSQL_ROOT_PASSWORD
        generateValue: true

  - type: web
    name: kaizen-kreasi-indonesia
    runtime: docker
    branch: main
    region: virginia
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    initialDeployHook: php artisan db:seed --force
    envVars:
      - key: APP_NAME
        value: Kaizen Kreasi Indonesia
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        fromService:
          type: web
          name: kaizen-kreasi-indonesia
          envVarKey: RENDER_EXTERNAL_URL
      - key: ADMIN_PASSWORD
        sync: false
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        fromService:
          type: pserv
          name: kaizen-mysql
          property: host
      - key: DB_PORT
        fromService:
          type: pserv
          name: kaizen-mysql
          property: port
      - key: DB_DATABASE
        value: comp_kaizen
      - key: DB_USERNAME
        value: kaizen_app
      - key: DB_PASSWORD
        fromService:
          type: pserv
          name: kaizen-mysql
          envVarKey: MYSQL_PASSWORD
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: FILESYSTEM_DISK
        value: public